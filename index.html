<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced AI NFT Collection</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #121212; color: #fff; }
    .card { background: #1e1e1e; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    button { padding: 12px 24px; font-size: 16px; font-weight: bold; margin: 10px; cursor: pointer; border: none; border-radius: 6px; }
    .btn-connect { background: #f6851b; color: white; }
    .btn-mint { background: #00d26a; color: white; }
    input { padding: 10px; width: 80%; margin-bottom: 15px; border-radius: 4px; border: 1px solid #333; }
    #status { margin-top: 15px; font-weight: bold; color: #00e676; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Advanced AI NFT Collection</h1>
    <p>Mint Price: <strong>0.001 Sepolia ETH</strong></p>
    
    <button id="connectBtn" class="btn-connect" onclick="connectWallet()">Connect MetaMask</button>
    <p id="walletAddress"></p>

    <hr style="border-color: #333; margin: 20px 0;">

    <input type="text" id="tokenURI" placeholder="Enter IPFS Metadata URL (e.g. https://gateway.pinata.cloud/...)" />
    <br>
    <button id="mintBtn" class="btn-mint" onclick="mintNFT()" disabled>Mint NFT</button>

    <div id="status"></div>
  </div>

  <script>
    const CONTRACT_ADDRESS = "0xdAc094537C3c2e5e333178CC8D95A955db333a2d";
    const CONTRACT_ABI = [
      "function mintNFT(string memory tokenURI) public payable returns (uint256)",
      "function tokenRarity(uint256 tokenId) public view returns (uint256)"
    ];

    let provider, signer, contract;

    async function connectWallet() {
      if (window.ethereum) {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        const address = await signer.getAddress();
        
        document.getElementById("walletAddress").innerText = "Connected: " + address.substring(0,6) + "..." + address.substring(38);
        document.getElementById("mintBtn").disabled = false;
        
        contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
      } else {
        alert("Please install MetaMask!");
      }
    }

    async function mintNFT() {
      const uri = document.getElementById("tokenURI").value;
      if (!uri) return alert("Please enter a valid IPFS Token URI!");

      const statusDiv = document.getElementById("status");
      try {
        statusDiv.innerText = "Transaction pending... Please confirm in MetaMask.";
        
        // Calls mintNFT with 0.001 ETH value attached
        const tx = await contract.mintNFT(uri, { value: ethers.utils.parseEther("0.001") });
        statusDiv.innerText = "Minting in progress... Waiting for block confirmation.";
        
        await tx.wait();
        statusDiv.innerText = "🎉 NFT Minted Successfully!";
      } catch (error) {
        console.error(error);
        statusDiv.innerText = "Error: " + (error.reason || error.message);
      }
    }
  </script>
</body>
</html>
